<path d="M330 350 H580" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="14" stroke-linecap="round" fill="none"/>
<path d="M330 420 H510" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="14" stroke-linecap="round" fill="none"/>
</g>
<path d="M345 700 C360 640 372 590 380 540 C410 590 452 560 500 530 C570 488 630 520 620 600 C612 660 612 700 650 712 C690 724 728 690 770 636" stroke="#60A5FA" stroke-opacity="0.75" stroke-width="64" stroke-linecap="round" fill="none" filter="url(#blur)"/>
<path d="M345 700 C360 640 372 590 380 540 C410 590 452 560 500 530 C570 488 630 520 620 600 C612 660 612 700 650 712 C690 724 728 690 770 636" stroke="url(#ink)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="770" cy="636" r="12" fill="#FFFFFF"/>
<rect width="1024" height="1024" fill="url(#sheen)"/>
