# iPad simulator: builds the app without signing and runs the hardware-key
# smoke test (ci/simulator). Fresh simulator, no user data. docs/TESTING.md.
name: Simulator

on:
  workflow_dispatch:
  push:
    branches: ['ci/**']
    paths:
      - 'Sources/**'
      - 'Core/Sources/**'
      - 'Core/Package.swift'
      - 'Package.swift'
      - 'Info.plist'
      - 'Resources/**'
      - 'ci/simulator/**'
      - '.github/workflows/simulator.yml'

permissions:
  contents: read

concurrency:
  group: simulator-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODEGEN_VERSION: '2.46.0'
  # Esc and Return as HID events, `typeKey` does not deliver these two.
  AXE_VERSION: '1.8.0'
  AXE_SHA256: 7b76340b72e90d0f211bc7c4636f15009076eff07acef2f2b632b175debd8834
  DEVICE: iPad Pro 11-inch (M5)
  DERIVED: ${{ github.workspace }}/.simulator/DerivedData
  OUT: ${{ github.workspace }}/.simulator/out

jobs:
  smoke:
    # The app uses the iOS 27 SDK; this image has Xcode 27 and iOS 27 simulators.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Xcode und Simulator wählen
        run: |
          xcodebuild -version
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, os, sys
          runtimes = json.load(sys.stdin)['devices']
          ios = sorted((r for r in runtimes if '.iOS-' in r), key=lambda r: [int(x) for x in r.rsplit('iOS-', 1)[1].split('-')])
          print(next(d['udid'] for r in reversed(ios) for d in runtimes[r] if d['name'] == os.environ['DEVICE']))")
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$udid"
          mkdir -p "$OUT"

      - name: XcodeGen laden
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: AXe laden
        run: |
          curl -fsSL -o "$RUNNER_TEMP/axe.tar.gz" "https://github.com/cameroncooke/AXe/releases/download/v$AXE_VERSION/AXe-macOS-v$AXE_VERSION-universal.tar.gz"
          echo "$AXE_SHA256  $RUNNER_TEMP/axe.tar.gz" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/axe"
          tar xzf "$RUNNER_TEMP/axe.tar.gz" -C "$RUNNER_TEMP/axe"
          echo "$RUNNER_TEMP/axe" >> "$GITHUB_PATH"

      - name: Projekt erzeugen
        working-directory: ci/simulator
        run: xcodegen generate

      - uses: actions/cache@v6
        with:
          path: ${{ env.DERIVED }}
          key: deriveddata-${{ runner.arch }}-${{ hashFiles('Sources/**', 'Core/Sources/**', 'ci/simulator/**') }}
          restore-keys: deriveddata-${{ runner.arch }}-

      - name: Bauen
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project ci/simulator/NotySim.xcodeproj -scheme NotySim \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=YES \
            | tee "$OUT/build.log" | grep -E "^(error|warning: unable)|error:|\*\* BUILD|Compiling .* failed" || true
          grep -q "TEST BUILD SUCCEEDED" "$OUT/build.log"

      - name: Simulator starten
        run: |
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b >/dev/null

      # The first AXe call of a run takes minutes: not during the test. Usage 0 is no key.
      - name: AXe aufwärmen
        timeout-minutes: 12
        run: axe key 0 --udid "$UDID"

      - name: Smoke-Test
        id: smoke
        timeout-minutes: 25
        run: |
          set -o pipefail
          trap 'kill $(jobs -p) 2>/dev/null' EXIT
          export HID_DIR="$OUT/hid"
          mkdir -p "$HID_DIR"
          bash ci/simulator/hid-bridge.sh "$HID_DIR" "$UDID" &
          # CPU of the app every 5 s: shows a busy loop behind a missing idle.
          (while true; do date +%T; ps -axo %cpu=,comm= | grep '/Noty$' || true; sleep 5; done > "$OUT/cpu.log") &
          TEST_RUNNER_HID_DIR="$HID_DIR" xcodebuild test-without-building \
            -project ci/simulator/NotySim.xcodeproj -scheme NotySim \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$DERIVED" \
            -resultBundlePath "$OUT/KeyboardSmoke.xcresult" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 360 -maximum-test-execution-time-allowance 420 \
            | tee "$OUT/test.log" | grep -E "Test Case|error:|\*\* TEST|Executed "

      - name: Ergebnisse und Screenshots auspacken
        if: always()
        run: |
          mkdir -p "$OUT/attachments"
          xcrun simctl spawn "$UDID" log show --last 40m --style compact \
            --predicate 'subsystem == "de.la.noty"' > "$OUT/keyboard.log" || true
          xcrun simctl io "$UDID" screenshot "$OUT/letzter-stand.png" || true
          if [ -d "$OUT/KeyboardSmoke.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$OUT/KeyboardSmoke.xcresult" --output-path "$OUT/attachments" || true
            xcrun xcresulttool get test-results tests --path "$OUT/KeyboardSmoke.xcresult" > "$OUT/tests.json" || true
          fi
          python3 ci/simulator/summary.py "$OUT" >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: simulator-smoke
          retention-days: 14
          path: |
            ${{ env.OUT }}/KeyboardSmoke.xcresult
            ${{ env.OUT }}/attachments
            ${{ env.OUT }}/keyboard.log
            ${{ env.OUT }}/cpu.log
            ${{ env.OUT }}/hid/bridge.log
            ${{ env.OUT }}/build.log
            ${{ env.OUT }}/test.log
            ${{ env.OUT }}/tests.json
            ${{ env.OUT }}/letzter-stand.png
