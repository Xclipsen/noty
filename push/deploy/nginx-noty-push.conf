# VORSCHLAG, nicht aktiv (docs/PUSH.md, „Betrieb“). Einbinden in den
# 443-Server-Block von /etc/nginx/sites-enabled/noty.xclipsen.de:
#
#   include /etc/nginx/noty-push.conf;      (vor „location / { return 404; }“)
#
# und die Rohpfad-Prüfung dieses Blocks um die Push-Pfade erweitern, sonst
# antwortet sie mit 404. Im bestehenden Ausdruck nach „(admin(/|…))?“ als
# weitere Alternative ergänzen:
#
#   |push/v1/(health|register|device|changes)
#
# d. h. ^/(admin(…)?|push/v1/(health|register|device|changes))(\?[A-Za-z0-9=&_-]*)?$
# (Abfrage nur [A-Za-z0-9=&_-]: passt für ?since=1762600000).
#
# Ratenlimit zusätzlich zum Dienst; die Zone gehört in den http-Kontext
# (z. B. /etc/nginx/conf.d/noty-push-zone.conf):
#
#   limit_req_zone $binary_remote_addr zone=notypush:1m rate=30r/m;

location = /push/v1/health   { include /etc/nginx/noty-push-proxy.conf; }
location = /push/v1/register { limit_except POST { deny all; } include /etc/nginx/noty-push-proxy.conf; }
location = /push/v1/device   { limit_except GET PUT DELETE { deny all; } include /etc/nginx/noty-push-proxy.conf; }
location = /push/v1/changes  { limit_except GET { deny all; } include /etc/nginx/noty-push-proxy.conf; }
