# Gemeinsame Proxy-Einstellungen der Push-Pfade (VORSCHLAG, nicht aktiv).
# /push/v1/x → http://127.0.0.1:8795/v1/x
limit_req zone=notypush burst=10 nodelay;
client_max_body_size 16k;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Registrierung/neue Freigabe: Testabruf bei WebUntis (2 × bis 40 s); der Dienst
# bricht eine Anfrage erst nach 150 s ab.
proxy_read_timeout 120s;
proxy_request_buffering on;
rewrite ^/push(/v1/.*)$ $1 break;
proxy_pass http://127.0.0.1:8795;
# Kein Zugriffslog mit Query/Headern nötig; Authorization wird von nginx nie geloggt.
access_log /var/log/nginx/noty-push.log;
